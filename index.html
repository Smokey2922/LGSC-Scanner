<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGSC - File Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #B464FF;
            --secondary: #00BEFF;
            --accent: #32DCC8;
            --dark-bg: #0A0C14;
            --dark-bg2: #10141F;
            --dark-bg3: #181E32;
            --text: #D7E1FF;
            --text-sub: #6478AA;
            --red: #FF4155;
        }

        html[lang="en"] {
            direction: ltr;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }

        /* Matrix Background - Real Full Matrix */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-bg);
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }

        .matrix-column {
            position: absolute;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.2;
            white-space: pre;
            animation: matrix-fall linear infinite;
            text-shadow: 0 0 10px var(--secondary);
        }

        @keyframes matrix-fall {
            0% {
                transform: translateY(-100%);
                opacity: 1;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh);
                opacity: 0;
            }
        }

        /* Floating particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            animation: float-particle 20s infinite ease-in-out;
        }

        @keyframes float-particle {
            0%, 100% {
                transform: translate(0, 0);
                opacity: 0.3;
            }
            50% {
                transform: translate(30px, -30px);
                opacity: 0.6;
            }
        }

        /* Header */
        header {
            position: relative;
            z-index: 10;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(180, 100, 255, 0.2);
            backdrop-filter: blur(10px);
            background: rgba(10, 12, 20, 0.9);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            animation: glow-text 3s ease-in-out infinite;
        }

        @keyframes glow-text {
            0%, 100% {
                text-shadow: 0 0 10px rgba(180, 100, 255, 0.5);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 190, 255, 0.8);
            }
        }

        .header-controls {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .lang-toggle {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(180, 100, 255, 0.3);
        }

        .lang-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 190, 255, 0.6);
        }

        .lang-toggle:active {
            transform: translateY(0);
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 5;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(180, 100, 255, 0.1) 0%, transparent 70%);
            animation: rotate-gradient 20s linear infinite;
            z-index: -1;
        }

        @keyframes rotate-gradient {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .hero-content h1 {
            font-size: 72px;
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slide-in-down 1s ease-out;
        }

        @keyframes slide-in-down {
            from {
                opacity: 0;
                transform: translateY(-50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: slide-in-up 1s ease-out 0.4s both;
        }

        .btn {
            padding: 15px 40px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 0 30px rgba(180, 100, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 50px rgba(0, 190, 255, 0.8);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary);
            border: 2px solid var(--secondary);
            box-shadow: inset 0 0 20px rgba(0, 190, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(0, 190, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: inset 0 0 30px rgba(0, 190, 255, 0.3), 0 0 30px rgba(0, 190, 255, 0.3);
        }

        /* Specs Section */
        .specs {
            padding: 100px 0;
            position: relative;
            z-index: 5;
        }

        .section-title {
            font-size: 48px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .specs-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .specs-list {
            list-style: none;
        }

        .specs-list li {
            padding: 15px 0;
            border-bottom: 1px solid rgba(180, 100, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 15px;
            animation: slide-in-right 0.6s ease-out forwards;
            font-size: 18px;
            min-height: 50px;
        }

        .specs-list li:nth-child(1) { animation-delay: 0.1s; }
        .specs-list li:nth-child(2) { animation-delay: 0.2s; }

        @keyframes slide-in-right {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .specs-list li::before {
            content: '✓';
            color: var(--accent);
            font-weight: bold;
            font-size: 20px;
            min-width: 20px;
        }

        .specs-image {
            background: linear-gradient(135deg, rgba(180, 100, 255, 0.15), rgba(0, 190, 255, 0.15));
            border: 2px solid rgba(0, 190, 255, 0.3);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            animation: float 3s ease-in-out infinite;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        .specs-image-icon {
            font-size: 120px;
        }

        /* Footer */
        footer {
            background: rgba(10, 12, 20, 0.9);
            border-top: 1px solid rgba(180, 100, 255, 0.2);
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 5;
            min-height: 100px;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Glitch effect */
        .glitch {
            position: relative;
            animation: glitch-anim 2s infinite;
        }

        @keyframes glitch-anim {
            0% {
                text-shadow: 0 0 0 transparent;
            }
            20% {
                text-shadow: -2px 0 var(--primary), 2px 0 var(--secondary);
            }
            40% {
                text-shadow: 0 0 0 transparent;
            }
            60% {
                text-shadow: -2px 0 var(--secondary), 2px 0 var(--primary);
            }
            80% {
                text-shadow: 0 0 0 transparent;
            }
            100% {
                text-shadow: 0 0 0 transparent;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            header {
                padding: 15px 20px;
            }

            .container {
                padding: 0 20px;
            }

            .hero-content h1 {
                font-size: 42px;
            }

            .section-title {
                font-size: 36px;
            }

            .specs-container {
                grid-template-columns: 1fr;
                gap: 40px;
            }

            .cta-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Background -->
    <div class="matrix-bg" id="matrixBg"></div>

    <!-- Header -->
    <header>
        <div class="logo">⚡ LGSC</div>
        <div class="header-controls">
            <button class="lang-toggle" id="langToggle">English</button>
        </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <div class="container">
            <div class="hero-content">
                <h1 class="glitch" data-he="File Scanner" data-en="File Scanner">File Scanner</h1>
                <div class="cta-buttons">
                    <button class="btn btn-primary" id="downloadBtn" data-he="הורד עכשיו" data-en="Download Now">Download Now</button>
                    <button class="btn btn-secondary" id="githubBtn" data-he="GitHub" data-en="GitHub">GitHub</button>
                    <button class="btn btn-secondary" id="discordBtn" data-he="Discord" data-en="Discord">Discord</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Specs Section -->
    <section class="specs">
        <div class="container">
            <h2 class="section-title" data-he="" data-en=""></h2>
            <div class="specs-container">
                <div>
                    <ul class="specs-list">
                        <li data-he="תמיכה ב-Windows 10/11" data-en="Support for Windows 10/11">Support for Windows 10/11</li>
                        <li data-he="ממשק משתמש מודרני וקל לשימוש" data-en="Modern and easy-to-use interface">Modern and easy-to-use interface</li>
                    </ul>
                </div>
                <div class="specs-image">
                    <div class="specs-image-icon">💻</div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="footer-content">
        </div>
    </footer>

    <script>
        // Language system
        let currentLang = 'en';

        const langToggle = document.getElementById('langToggle');
        langToggle.addEventListener('click', toggleLanguage);

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'he' : 'en';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'he' ? 'rtl' : 'ltr';
            
            // Update all elements with data attributes
            document.querySelectorAll('[data-he][data-en]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) {
                    el.textContent = text;
                }
            });

            // Update button text
            langToggle.textContent = currentLang === 'en' ? 'עברית' : 'English';

            // Trigger animation
            langToggle.style.animation = 'none';
            setTimeout(() => {
                langToggle.style.animation = '';
            }, 10);
        }

        // Button click handlers
        document.getElementById('downloadBtn').addEventListener('click', () => {
            window.location.href = 'https://github.com/eitan743583/LGSC_SC/releases/download/v1.0/Scanner.exe';
        });

        document.getElementById('githubBtn').addEventListener('click', () => {
            window.open('https://github.com/eitan743583/LGSC_SC', '_blank');
        });

        document.getElementById('discordBtn').addEventListener('click', () => {
            window.open('https://discord.gg/84R9as5pAW', '_blank');
        });

        // Real Matrix Background Effect - Full Screen
        function createMatrixEffect() {
            const matrixBg = document.getElementById('matrixBg');
            const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
            
            // Create multiple columns
            const columnCount = Math.floor(window.innerWidth / 30);
            
            for (let col = 0; col < columnCount; col++) {
                const column = document.createElement('div');
                column.className = 'matrix-column';
                
                // Generate random characters for this column
                let columnText = '';
                const charCount = Math.floor(Math.random() * 15) + 10;
                for (let i = 0; i < charCount; i++) {
                    columnText += chars[Math.floor(Math.random() * chars.length)] + '\n';
                }
                
                column.textContent = columnText;
                column.style.left = (col * 30) + 'px';
                column.style.top = (Math.random() * 100 - 100) + '%';
                column.style.animationDuration = (Math.random() * 8 + 12) + 's';
                column.style.animationDelay = Math.random() * 5 + 's';
                column.style.opacity = Math.random() * 0.5 + 0.3;
                
                matrixBg.appendChild(column);
            }

            // Add floating particles
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = (Math.random() * 6 + 2) + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.background = Math.random() > 0.5 ? 'var(--primary)' : 'var(--secondary)';
                particle.style.animationDuration = (Math.random() * 15 + 20) + 's';
                particle.style.animationDelay = Math.random() * 5 + 's';
                matrixBg.appendChild(particle);
            }
        }

        // Initialize matrix effect
        createMatrixEffect();

        // Recreate matrix on window resize
        window.addEventListener('resize', () => {
            const matrixBg = document.getElementById('matrixBg');
            matrixBg.innerHTML = '';
            createMatrixEffect();
        });

        // Button click effects
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.5)';
                ripple.style.width = '20px';
                ripple.style.height = '20px';
                ripple.style.animation = 'ripple-effect 0.6s ease-out';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        // Add ripple animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple-effect {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
