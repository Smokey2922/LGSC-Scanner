<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LGSC - File Scanner</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #B464FF;
            --secondary: #00BEFF;
            --accent: #32DCC8;
            --dark-bg: #0A0C14;
            --text: #D7E1FF;
        }

        html[lang="en"] {
            direction: ltr;
        }

        body {
            font-family: 'Courier New', monospace;
            background-color: var(--dark-bg);
            color: var(--text);
            overflow-x: hidden;
            position: relative;
        }

        /* Matrix Background */
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Content */
        .content {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px;
        }

        .logo {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }

        .lang-toggle {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 18px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(180, 100, 255, 0.4);
        }

        .lang-toggle:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 190, 255, 0.6);
        }

        /* Main Section */
        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
            text-align: center;
            flex: 1;
        }

        h1 {
            font-size: 80px;
            font-weight: bold;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% {
                text-shadow: 0 0 10px rgba(180, 100, 255, 0.3);
            }
            50% {
                text-shadow: 0 0 20px rgba(0, 190, 255, 0.6);
            }
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 0 20px rgba(180, 100, 255, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 190, 255, 0.7);
        }

        .btn-secondary {
            background: transparent;
            color: var(--secondary);
            border: 1.5px solid var(--secondary);
            box-shadow: inset 0 0 15px rgba(0, 190, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(0, 190, 255, 0.1);
            transform: translateY(-2px);
            box-shadow: inset 0 0 20px rgba(0, 190, 255, 0.2), 0 0 25px rgba(0, 190, 255, 0.4);
        }

        /* Specs Section */
        .specs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            width: 100%;
            max-width: 1000px;
            margin-top: 50px;
        }

        .specs-left {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .spec-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 18px;
            padding: 10px 0;
            border-bottom: 1px solid rgba(180, 100, 255, 0.2);
            min-height: 32px;
        }

        .spec-item::before {
            content: '✓';
            color: var(--accent);
            font-weight: bold;
            font-size: 22px;
            min-width: 22px;
        }

        .specs-right {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(180, 100, 255, 0.1), rgba(0, 190, 255, 0.1));
            border: 1.5px solid rgba(0, 190, 255, 0.3);
            border-radius: 18px;
            padding: 30px;
            min-height: 180px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .specs-right-icon {
            font-size: 120px;
        }

        /* Footer */
        footer {
            width: 100%;
            text-align: center;
            padding: 5px 20px;
            border-top: 1px solid rgba(180, 100, 255, 0.2);
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 32px;
            }

            .specs {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Matrix Canvas -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Content -->
    <div class="content">
        <!-- Header -->
        <header>
            <div class="logo">⚡ LGSC</div>
            <button class="lang-toggle" id="langToggle">English</button>
        </header>

        <!-- Main -->
        <div class="main">
            <h1 data-he="File Scanner" data-en="File Scanner">File Scanner</h1>
            
            <div class="buttons">
                <button class="btn btn-primary" id="downloadBtn" data-he="הורד עכשיו" data-en="Download Now">Download Now</button>
                <button class="btn btn-secondary" id="githubBtn" data-he="GitHub" data-en="GitHub">GitHub</button>
                <button class="btn btn-secondary" id="discordBtn" data-he="Discord" data-en="Discord">Discord</button>
            </div>

            <!-- Specs -->
            <div class="specs">
                <div class="specs-left">
                    <div class="spec-item" data-he="תמיכה ב-Windows 10/11" data-en="Support for Windows 10/11">Support for Windows 10/11</div>

                </div>
                <div class="specs-right">
                    <div class="specs-right-icon">💻</div>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer></footer>
    </div>

    <script>
        // Language Toggle
        let currentLang = 'en';
        const langToggle = document.getElementById('langToggle');
        
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'he' : 'en';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'he' ? 'rtl' : 'ltr';
            
            document.querySelectorAll('[data-he][data-en]').forEach(el => {
                const text = el.getAttribute(`data-${currentLang}`);
                if (text) {
                    el.textContent = text;
                }
            });
            
            langToggle.textContent = currentLang === 'en' ? 'עברית' : 'English';
        });

        // Button Handlers
        document.getElementById('downloadBtn').addEventListener('click', () => {
            window.location.href = 'https://github.com/Smokey2922/LGSC_SC/releases/download/v1.0/Scanner.exe';
        });

        document.getElementById('githubBtn').addEventListener('click', () => {
            window.open('https://github.com/eitan743583/LGSC_SC', '_blank');
        });

        document.getElementById('discordBtn').addEventListener('click', () => {
            window.open('https://discord.gg/84R9as5pAW', '_blank');
        });

        // Matrix Effect
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン';
        const fontSize = 14;
        const columns = Math.floor(canvas.width / fontSize);

        const drops = Array(columns).fill(0).map(() => Math.random() * canvas.height);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(10, 12, 20, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(0, 190, 255, 0.3)';
            ctx.font = `${fontSize}px 'Courier New'`;

            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);

                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        function animate() {
            drawMatrix();
            requestAnimationFrame(animate);
        }

        animate();

        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Button ripple effect
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                const ripple = document.createElement('span');
                ripple.style.position = 'absolute';
                ripple.style.borderRadius = '50%';
                ripple.style.background = 'rgba(255, 255, 255, 0.5)';
                ripple.style.width = '10px';
                ripple.style.height = '10px';
                ripple.style.animation = 'ripple 0.6s ease-out';
                this.appendChild(ripple);
                setTimeout(() => ripple.remove(), 600);
            });
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes ripple {
                to {
                    transform: scale(4);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
